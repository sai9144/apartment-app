<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a5f7a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vijayalakshmi Heights">
  <title>Vijayalakshmi Heights</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <!-- Auth Screens -->
    <div id="screen-login" class="screen active" role="main">
      <div class="auth-card">
        <div class="logo"><svg viewBox="0 0 64 64"><rect x="8" y="16" width="48" height="36" rx="4" fill="currentColor"/><rect x="16" y="22" width="12" height="12" rx="2" fill="#fff"/><rect x="36" y="22" width="12" height="12" rx="2" fill="#fff"/><rect x="16" y="38" width="32" height="6" rx="2" fill="#fff"/></svg></div>
        <h1>Vijayalakshmi Heights</h1>
        <p class="subtitle">Apartment Society App</p>
        <form id="form-login">
          <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div>
          <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
          <button type="submit" class="btn primary">Sign In</button>
        </form>
        <p class="switch">New here? <button type="button" id="btn-show-register">Create Account</button></p>
      </div>
    </div>

    <div id="screen-register" class="screen" role="main">
      <div class="auth-card">
        <div class="logo"><svg viewBox="0 0 64 64"><rect x="8" y="16" width="48" height="36" rx="4" fill="currentColor"/><rect x="16" y="22" width="12" height="12" rx="2" fill="#fff"/><rect x="36" y="22" width="12" height="12" rx="2" fill="#fff"/><rect x="16" y="38" width="32" height="6" rx="2" fill="#fff"/></svg></div>
        <h1>Create Account</h1>
        <p class="subtitle">Join your community</p>
        <form id="form-register">
          <div class="field"><label>Full Name</label><input type="text" name="name" required autocomplete="name"></div>
          <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div>
          <div class="field"><label>Phone</label><input type="tel" name="phone" autocomplete="tel"></div>
          <div class="field"><label>Apartment (e.g., A-101)</label><input type="text" name="apartment" required autocomplete="off"></div>
          <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="new-password" minlength="6"></div>
          <button type="submit" class="btn primary">Register</button>
        </form>
        <p class="switch">Have an account? <button type="button" id="btn-show-login">Sign In</button></p>
      </div>
    </div>

    <!-- Main App Shell -->
    <div id="screen-app" class="screen" role="main">
      <header class="app-header">
        <div class="header-left">
          <button class="icon-btn" id="btn-menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
          <h1 id="header-title">Dashboard</h1>
        </div>
        <div class="header-right">
          <button class="icon-btn" id="btn-notifications" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2"/></svg><span class="badge" id="notif-badge" hidden>0</span></button>
          <button class="icon-btn" id="btn-profile" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 14c-5 0-8 3-8 6" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
        </div>
      </header>

      <main class="app-main" id="app-main"></main>

      <nav class="bottom-nav" id="bottom-nav" hidden>
        <a href="#" data-tab="dashboard" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" fill="none"/><polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="2"/></svg><span>Home</span></a>
        <a href="#" data-tab="visitors" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M23 21v-2a4 4 0 0 0-3-3.87" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 3.13a4 4 0 0 1 0 7.75" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>Visitors</span></a>
        <a href="#" data-tab="complaints" class="nav-item"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" stroke="currentColor" stroke-width="2" fill="none"/><polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2"/><line x1="12" y1="18" x2="12.01" y2="18" stroke="currentColor" stroke-width="2"/><line x1="12" y1="12" x2="12.01" y2="12" stroke="currentColor" stroke-width="2"/></svg><span>Complaints</span></a>
        <a href="#" data-tab="notices" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="2" fill="none"/><polyline points="22 6 12 13 2 6" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>Notices</span></a>
        <a href="#" data-tab="more" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>More</span></a>
      </nav>
    </div>

    <!-- Side Drawer -->
    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-header">
        <div class="user-info">
          <div class="avatar" id="drawer-avatar"></div>
          <div><strong id="drawer-name">Resident</strong><br><small id="drawer-apartment"></small></div>
        </div>
        <button class="icon-btn" id="btn-close-drawer" aria-label="Close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/></svg></button>
      </div>
      <nav class="drawer-nav">
        <a href="#" data-tab="dashboard"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" fill="none"/></svg> Dashboard</a>
        <a href="#" data-tab="visitors"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none"/></svg> Visitors</a>
        <a href="#" data-tab="complaints"><svg viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" stroke="currentColor" stroke-width="2" fill="none"/></svg> Complaints</a>
        <a href="#" data-tab="notices"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="2" fill="none"/></svg> Notices</a>
        <a href="#" data-tab="polls"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2"/></svg> Polls</a>
        <a href="#" data-tab="directory"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2" fill="none"/></svg> Directory</a>
        <a href="#" data-tab="messages"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" fill="none"/></svg> Messages</a>
        <a href="#" data-tab="settings" id="drawer-settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2" fill="none"/></svg> Settings</a>
      </nav>
      <div class="drawer-footer">
        <button class="btn ghost" id="btn-logout">Sign Out</button>
      </div>
    </aside>
    <div id="drawer-overlay" class="drawer-overlay" hidden></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
